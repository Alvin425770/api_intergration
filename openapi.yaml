openapi: 3.0.3
info:
  title: NyumbaHub API (with GymBuddy Partner Integration)
  version: 1.1.0
  description: |
    REST API for students, housing listings, bookings and the GymBuddy
    partner amenity.
 
    **Authentication.** Every endpoint except `GET /` requires an API key in
    the `X-API-Key` request header. A missing or unknown key returns `401`.
    Never share your key publicly; keys are issued privately per consumer.
 
    **Rate limiting.** Requests are limited per API key (100 requests per
    minute). Over the limit the API answers `429` with a `Retry-After` header
    (seconds) and a JSON body `{ "message": "Too many requests", "retryAfter": 42 }`.
 
    **Error formats.** The API currently uses three error shapes, documented
    in `components/schemas`: `{ message }` (auth, rate limit, partner),
    `{ code, message }` (listings, bookings) and `{ error }` (students).
    A request body that is not valid JSON returns `400` with an HTML error
    page, not JSON.
servers:
  - url: http://localhost:5000
    description: Local development
security:
  - ApiKeyAuth: []
tags:
  - name: Health
  - name: Students
  - name: Listings
  - name: Bookings
  - name: GymBuddy
 
paths:
  /:
    get:
      tags: [Health]
      summary: Health check
      description: Public endpoint, no API key needed.
      security: []
      responses:
        '200':
          description: The API is running.
          content:
            text/plain:
              schema:
                type: string
                example: API is running
 
  /api/students:
    get:
      tags: [Students]
      summary: List all students
      responses:
        '200':
          description: All students (a plain array, not wrapped in an object).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Student'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/StudentsInternalError'
    post:
      tags: [Students]
      summary: Add a student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentInput'
            example:
              name: Jane Doe
              email: jane@example.com
              course: Computer Science
      responses:
        '201':
          description: Student created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400':
          description: One of name, email or course is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSimple'
              example:
                error: name, email, and course are required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/StudentsInternalError'
 
  /api/students/{id}:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    put:
      tags: [Students]
      summary: Update a student
      description: |
        Send all three fields. This route does not check that the student
        exists: an unknown id still returns `200` and changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentInput'
      responses:
        '200':
          description: Echoes the submitted values. The `id` comes back as a string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentUpdated'
              example:
                id: '10'
                name: Amina Hassan
                email: amina.hassan@strathmore.edu
                course: Software Engineering
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/StudentsInternalError'
    delete:
      tags: [Students]
      summary: Delete a student
      description: Deleting an unknown id also returns `200` with the same message.
      responses:
        '200':
          description: Student deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                example:
                  message: Student deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/StudentsInternalError'
 
  /listings:
    get:
      tags: [Listings]
      summary: Listings that changed to available since a given date
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [available]
        - $ref: '#/components/parameters/UpdatedSince'
      responses:
        '200':
          description: Matching listings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  listings:
                    type: array
                    items:
                      $ref: '#/components/schemas/ListingChange'
        '400':
          $ref: '#/components/responses/InvalidQueryParam'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
 
  /listings/{id}/landlord-contact:
    parameters:
      - $ref: '#/components/parameters/ListingId'
    get:
      tags: [Listings]
      summary: Landlord contact details for a listing
      description: |
        Contact details are only returned if the landlord opted in. Otherwise
        the response is `200` with `available: false` and `contact: null`.
      responses:
        '200':
          description: Contact availability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandlordContact'
              examples:
                optedIn:
                  summary: Landlord opted in
                  value:
                    available: true
                    contact:
                      name: Jane Wanjiru
                      phone: '0722000001'
                      email: jane@example.com
                notOptedIn:
                  summary: Landlord has not opted in
                  value:
                    available: false
                    contact: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ListingNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
 
  /listings/{id}/location:
    parameters:
      - $ref: '#/components/parameters/ListingId'
    get:
      tags: [Listings]
      summary: Area and city of a listing
      responses:
        '200':
          description: Listing location.
          content:
            application/json:
              schema:
                type: object
                properties:
                  area:
                    type: string
                  city:
                    type: string
                example:
                  area: Kilimani
                  city: Nairobi
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ListingNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
 
  /listings/{id}/size:
    parameters:
      - $ref: '#/components/parameters/ListingId'
    get:
      tags: [Listings]
      summary: Bedrooms and bathrooms of a listing
      responses:
        '200':
          description: Listing size.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bedrooms:
                    type: integer
                  bathrooms:
                    type: integer
                example:
                  bedrooms: 2
                  bathrooms: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ListingNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
 
  /bookings:
    get:
      tags: [Bookings]
      summary: Bookings that were refunded since a given date
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: string
            enum: [refunded]
        - $ref: '#/components/parameters/UpdatedSince'
      responses:
        '200':
          description: Matching bookings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: '#/components/schemas/RefundedBooking'
        '400':
          $ref: '#/components/responses/InvalidQueryParam'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
 
  /bookings/{id}/escrow-status:
    parameters:
      - name: id
        in: path
        required: true
        description: Booking id.
        schema:
          type: string
    get:
      tags: [Bookings]
      summary: Escrow status of a booking
      description: Payments and escrow are simulated. This endpoint only reads stored records.
      responses:
        '200':
          description: Escrow status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookingId:
                    type: string
                  escrowStatus:
                    type: string
                  updatedAt:
                    type: string
                    format: date-time
                example:
                  bookingId: '1'
                  escrowStatus: released
                  updatedAt: '2026-09-21T19:54:07.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No booking with that id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCode'
              example:
                code: booking_not_found
                message: No booking with id 9999
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
 
  /api/gym/memberships:
    get:
      tags: [GymBuddy]
      summary: GymBuddy membership tiers (proxied from the partner)
      description: |
        The backend calls the GymBuddy partner API and returns only the
        agreed contract fields `tier`, `price` and `details`. Any other field
        the partner sends is dropped. If the partner is down or answers with
        an error status, this endpoint returns `502`.
      responses:
        '200':
          description: Membership tiers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Membership'
              example:
                - tier: Daily Drop-In
                  price: 500 KES
                  details: Full facility access for 24 hours.
                - tier: Monthly Standard
                  price: 5,000 KES
                  details: Unlimited access + GymBuddy App.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          description: The partner is unavailable (connection failed or it returned an error status).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                message: Partner data unavailable
 
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key issued to the client. Send it on every request except `GET /`.
 
  parameters:
    StudentId:
      name: id
      in: path
      required: true
      description: Student id.
      schema:
        type: string
    ListingId:
      name: id
      in: path
      required: true
      description: Listing id.
      schema:
        type: string
    UpdatedSince:
      name: updatedSince
      in: query
      required: true
      description: |
        Only records updated on or after this date, for example `2026-01-01`.
        A value that is not a date currently returns `500` (known issue).
      schema:
        type: string
      example: '2026-01-01'
 
  responses:
    Unauthorized:
      description: The `X-API-Key` header is missing or the key is not valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          example:
            message: Missing or invalid API key
    TooManyRequests:
      description: This API key exceeded its rate limit. Wait the number of seconds in `Retry-After`, then retry.
      headers:
        Retry-After:
          description: Seconds until the limit resets.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimited'
          example:
            message: Too many requests
            retryAfter: 42
    InvalidQueryParam:
      description: A required query parameter is missing or has an unsupported value.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorCode'
          example:
            code: invalid_query_param
            message: status and updatedSince are required query parameters
    ListingNotFound:
      description: No listing with that id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorCode'
          example:
            code: listing_not_found
            message: No listing with id 9999
    InternalError:
      description: Unexpected server or database error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorCode'
          example:
            code: internal_error
            message: Failed to fetch listings
    StudentsInternalError:
      description: Database error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorSimple'
          example:
            error: Failed to fetch students
 
  schemas:
    ErrorMessage:
      type: object
      description: Used by authentication and the partner endpoint.
      properties:
        message:
          type: string
    RateLimited:
      type: object
      description: Returned with status 429, together with a `Retry-After` header.
      required: [message, retryAfter]
      properties:
        message:
          type: string
        retryAfter:
          type: integer
          description: Seconds to wait before retrying.
    ErrorCode:
      type: object
      description: Used by the listings and bookings routes.
      properties:
        code:
          type: string
        message:
          type: string
    ErrorSimple:
      type: object
      description: Used by the students routes.
      properties:
        error:
          type: string
 
    StudentInput:
      type: object
      required: [name, email, course]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        course:
          type: string
    Student:
      allOf:
        - type: object
          properties:
            id:
              type: integer
        - $ref: '#/components/schemas/StudentInput'
    StudentUpdated:
      allOf:
        - type: object
          properties:
            id:
              type: string
        - $ref: '#/components/schemas/StudentInput'
 
    ListingChange:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          example: available
        reason:
          type: string
          enum: [vacated, newly_listed]
        updatedAt:
          type: string
          format: date-time
    RefundedBooking:
      type: object
      properties:
        id:
          type: string
        listingId:
          type: string
        status:
          type: string
          example: refunded
        refundReasonCategory:
          type: string
          description: Defaults to `other` when no category is stored.
          example: property_mismatch
        updatedAt:
          type: string
          format: date-time
    LandlordContact:
      type: object
      properties:
        available:
          type: boolean
        contact:
          type: object
          nullable: true
          properties:
            name:
              type: string
            phone:
              type: string
            email:
              type: string
              nullable: true
    Membership:
      type: object
      required: [tier, price, details]
      properties:
        tier:
          type: string
        price:
          type: string
        details:
          type: string
 
